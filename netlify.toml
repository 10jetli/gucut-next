# ⚙️ ตั้งค่า build ของ Netlify — **ไฟล์นี้เพิ่งมีครั้งแรก 21 ก.ย. 2569**
#
# 🔴 **ทำไมถึงต้องมี** (ฝั่งท่อชี้ให้ และเป็นผู้ต้องสงสัยของ build ที่ล้มซ้ำ ๆ)
#    ก่อนหน้านี้รีโปนี้ **ไม่ประกาศรุ่น node ไว้เลย** ⇒ Netlify เลือกให้เอง
#    และ **เปลี่ยนค่าเริ่มต้นได้เองเมื่อไหร่ก็ได้** ⇒ build ที่เคยผ่านจะล้มวันหนึ่งโดยไม่มีใครแก้อะไร
#    ⇒ ⇒ อธิบายได้ด้วยว่าทำไม **เครื่องเราผ่านแต่ที่นั่นล้ม**: เครื่องนี้รัน node v22
#       ส่วนที่นั่นรันรุ่นอะไรก็ได้ที่ Netlify ตั้งเป็นค่าเริ่มต้นวันนั้น
#
# 🔴 ~~ตรึงเป็น **20** ให้ตรงกับฝั่งท่อ — เหตุผล: อยากได้รุ่นเดียวกันทั้งสองโปรเจกต์~~
#    **ผิด และทำ Netlify build ล้มทุกใบ 26 ก.ย. 2569** (ไม่ลบทิ้ง เพื่อให้เห็นว่าเคยคิดผิดเพราะอะไร)
#    วัดของจริงด้วย node 20.20.2 ในเครื่อง: สายด่านล้มที่ **ขั้นที่ 11**
#      TypeError [ERR_UNKNOWN_FILE_EXTENSION]: Unknown file extension ".ts" for lib/หัวยุค.ts
#    ⇒ รีโปนี้มี **5 ไฟล์เทสที่ import `.ts` ตรง ๆ** ⇒ พึ่งความสามารถถอด type ของ node ≥ 22.6
#      (ฝั่งท่อเป็น `.mjs` ล้วน ⇒ 20 ใช้ได้ที่นั่นจริง · **ข้อกำหนดของสองรีโปไม่เหมือนกัน**)
#    🔑 บทเรียน: "ให้เหมือนกันทั้งสองฝั่ง" เป็นความอยากของเรา
#       ส่วน "รุ่นไหนรันโค้ดนี้ได้" เป็น **ข้อเท็จจริงของ runtime** ⇒ ข้อเท็จจริงชนะความอยาก
#
# 📌 ตรึงเป็น **22** — ตรงกับรุ่นที่ทดสอบผ่านจริงในเครื่อง (v22.23.x) และตรงกับที่ Netlify
#    เคยเลือกให้เองตอนที่ build ยังผ่าน (deploy `d877c12` ผ่านใน 12m 4s ก่อนมีไฟล์นี้)
#    ⚠️ จะขยับลงต่ำกว่า 22 ได้ต่อเมื่อ **เลิก import `.ts` จากสคริปต์ `.mjs` ให้หมดก่อน**
#       ⇒ ด่าน `scripts/check-node-version.mjs` (ขั้นแรกสุด) จะบอกรายชื่อไฟล์ให้ตอนตก
#
# 🔑 และข้อนี้เป็นคลาสที่เราเจอซ้ำ: **ค่าที่ไม่ได้ประกาศ ไม่ได้แปลว่าคงที่ — แปลว่าคนอื่นเป็นคนเลือกให้**
#    (เหมือน "ไม่มีแถว" ที่ไม่ได้แปลว่าไม่มีของ)
#
# 🚫 จงใจ **ไม่ใส่** `command` / `publish` ไว้ที่นี่ — สองค่านั้นตั้งอยู่ที่หน้า Netlify แล้ว
#    ใส่ซ้ำ = มีที่ตั้งค่าสองที่ ⇒ วันหนึ่งจะเพี้ยนกันเอง (กฎ "เลขเกณฑ์ต้องมีที่เดียว")

[build.environment]
  NODE_VERSION = "22"
